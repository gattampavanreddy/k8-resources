apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
labels:
    project: roboshop
    purpose: rs-demo 
    tier : frontend
    component: frontend
annotations:
  kubernetes.io/change-cause: "moving to 1.29.7"
spec:
  replicas: 1
  selector: 
    # using these labels as selector, replicaset will manage all pods with these labels
    matchLabels:
      project: roboshop
      purpose: rs-demo 
      tier : frontend
      component: frontend
      # this is pod definition, pod is subset of replicaset, so we can use pod labels as selector
  template:
    metadata:
      labels:
        project: roboshop
        purpose: rs-demo 
        tier : frontend
        component: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:1.29.7